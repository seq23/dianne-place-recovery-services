name: Search Loop

# The shared search growth engine (seq23/search-loop), owner ruling 1 Nov 2026:
# find easy searches weekly, publish one gated page per search daily under
# /questions/ on detoxdenver.org (public/questions/, served by the Next static
# export), check every page at 2/4/8 weeks, strengthen / undo / merge, and
# upload the weekly report artifact "search-loop-week". No approval queue for
# this site; the engine's health gate (no outcome or treatment claims, no
# medical advice, no hours or services beyond search-loop.config.json
# health.real_facts) runs before anything publishes. Reports stay in this repo.
# The global switch SEARCH_LOOP_MODE on seq23/search-loop (normal | slow | off)
# throttles it without touching this repo.
on:
  schedule:
    - cron: "29 12 * * *"  # 12:29 UTC: its own minute (12:53 UTC is hicks-consulting-canonical in winter)
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: search-loop
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'auto' }}
      # New pages join public/sitemap.xml (the push then fires the IndexNow ping
      # in search_intelligence.yml). Pure node, no install needed.
      post_build_command: node scripts/seo/build_sitemap.mjs
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      # $0 model lanes (engine v1.2.3): Gemini free tier (no-billing project), metered Workers AI
      # (usage read with the analytics token, model run with the Workers AI token; 600 neurons/day).
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_USAGE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
