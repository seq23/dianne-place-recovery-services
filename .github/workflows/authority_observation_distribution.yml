name: Authority Observation and Distribution

on:
  workflow_run:
    workflows: ["Content Publish"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '10 4 * * 5'  # America/Chicago, all year
      timezone: America/Chicago

permissions:
  contents: write

concurrency:
  group: dianne-authority-observation
  cancel-in-progress: false

jobs:
  observe-and-distribute:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: git pull --rebase origin main
      # The synthetic 100K query fan-out and its recommendation-only backlog were
      # retired on 1 Nov 2026: the search-loop engine (search-loop.yml) now finds
      # real searches and builds, checks and repairs pages. Their last outputs stay
      # in data/authority_scale as history.
      - name: Refresh the distribution manifest from the sitemap
        run: npm run authority:distribution
      - name: Submit already-public URLs when provider credentials are configured
        run: npm run distribution:submit
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_INSPECTION_LIMIT: 20
          INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
      - name: Validate sidecar and protected client core
        run: npm run validate:authority-modernization
      - name: Commit observation and provider receipts only
        run: |
          git config user.name "dianne-authority-observer"
          git config user.email "actions@github.com"
          git add data/authority_scale data/distribution data/continuity
          if git diff --cached --quiet; then
            echo "No authority observation changes."
          else
            git commit -m "Observe authority yield and distribution"
            git push origin main
          fi
